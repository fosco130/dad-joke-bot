name: Post Dad Joke

on:
  schedule:
    # Runs at 5 PM BST every weekday (Monday-Friday) — 16:00 UTC.
    # Note: GitHub Actions cron is UTC only, so during GMT (late Oct – late Mar)
    # this fires at 4 PM London time. Bump the hour back to 17 to track GMT
    # if that matters, or live with the winter hour drift.
    - cron: '0 16 * * 1-5'
  workflow_dispatch: # Allows manual triggering

jobs:
  post-joke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Post joke to Slack
        timeout-minutes: 2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          BOT_EMOJI: ':man_with_mustache:'
        run: node index.js
